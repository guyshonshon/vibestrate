name: CI

# Typecheck, test, build, and audit on every push to main and every PR. This is
# the fast required gate, Ubuntu only. Native Windows is verified separately and
# on demand (.github/workflows/ci-windows.yml) so it never slows down a push and
# nothing here depends on it.
#
# This gate must stay a superset of scripts/release.sh. When the two diverge, a
# blocked release looks green here until someone tries to publish - which is
# exactly how three high-severity advisories sat unnoticed behind a green badge.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 24 is the floor `engines.node` declares and the line most people run, so a
    # break there blocks a release. 26 is Current, not LTS until October - it is
    # here to catch a Node change early rather than on the day it becomes LTS,
    # since the alternative is finding out from a user's install.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Several tests make real git commits (e.g. git-init); GitHub runners have
      # no default git identity.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@vibestrate.local"
          git config --global user.name "Vibestrate CI"

      - name: Typecheck
        run: pnpm typecheck

      # Build before test: the shell-command-runner test spawns the
      # bundled dist/index.js, so dist must exist first.
      - name: Build
        run: pnpm build

      # The build regenerates LICENSES/third-party-browser.txt from the bundle's
      # sourcemaps. If a dependency changed and nobody re-ran the build, the
      # committed notice under-attributes the code we publish - and no test can
      # see it, because the build has already rewritten the file the test reads.
      # Git is the only witness that the committed copy was stale.
      - name: Third-party licence notice is current
        run: git diff --exit-code -- LICENSES

      - name: Test
        run: pnpm test

      # Runtime dependencies only: a dev-only advisory should not block a
      # feature PR, but anything that ships to a user's machine should.
      # Fix a transitive pin with pnpm.overrides - Dependabot cannot.
      - name: Audit (prod)
        run: pnpm audit --prod

      # The last step release.sh runs that CI did not, which is exactly the
      # divergence the header above warns about. Packs the tarball, installs it
      # in a clean room and smokes the bin, so a bad `files` list or a runtime
      # dep left in devDependencies fails here rather than at publish time.
      - name: Verify packed artifact
        run: bash scripts/verify-pack.sh
