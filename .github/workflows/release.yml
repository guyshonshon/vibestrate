name: Release

# Publish to npm from CI using **trusted publishing** (OIDC): npm mints a
# short-lived credential for this workflow, so there is no NPM_TOKEN stored
# anywhere and nothing to rotate or leak. It also makes `--provenance` real -
# npm only attests a build it can trace to a supported CI, which is why the flag
# never worked from a laptop.
#
# Trigger: pushing a `v*` tag, or a manual dispatch. The version published is
# whatever `package.json` says at that tag - this workflow never bumps. Tag and
# bump stay a human decision made in the repo (scripts/release.sh), so a
# mis-tagged release cannot be manufactured by re-running a job.
#
# The gate below deliberately mirrors ci.yml and scripts/release.sh step for
# step, including the packed-artifact verify. A release must not be able to pass
# a weaker bar than an ordinary push to main.
#
# Setup this expects, once (see .github/MAINTAINING.md):
#   1. npmjs.com -> vibestrate -> Settings -> Trusted Publisher -> GitHub Actions
#      -> repo guyshonshon/vibestrate, workflow release.yml
#   2. Settings -> Environments -> `release` -> Required reviewers (you), so a
#      tag push PAUSES for a click instead of publishing on its own.
# Without (2) a tag publishes unattended; without (1) the publish step fails
# closed on auth and nothing ships.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gates the job behind the `release` environment's required reviewers.
    environment: release
    permissions:
      contents: read
      # Required for trusted publishing: lets the job request the OIDC token npm
      # exchanges for a publish credential. Nothing else needs it.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs an npm newer than the one bundled with Node,
      # which lags the OIDC support. Pinning to the bundled npm silently loses
      # provenance rather than failing, so this stays even as Node moves.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # Several tests make real git commits (e.g. git-init); GitHub runners have
      # no default git identity.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@vibestrate.local"
          git config --global user.name "Vibestrate CI"

      - name: Typecheck
        run: pnpm typecheck

      # Build before test: the shell-command-runner test spawns the bundled
      # dist/index.js, so dist must exist first.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Audit (prod)
        run: pnpm audit --prod

      - name: Verify packed artifact
        run: bash scripts/verify-pack.sh

      # A tag whose name disagrees with package.json means someone tagged the
      # wrong commit. Publishing that ships a version under a name nobody wrote
      # a changelog for, and npm versions cannot be reused - so fail here.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG."
            exit 1
          fi
          echo "Publishing $PKG."

      # `prepublishOnly` runs the build and strips sourcemaps, so the tarball
      # matches what verify-pack.sh just proved installs from a clean room.
      #
      # `--tag latest` is explicit on purpose. npm refuses to apply the latest
      # tag IMPLICITLY when the version being published is lower than the one
      # already there ("Cannot implicitly apply the latest tag because
      # previously published version X is higher"), which is a guard against
      # publishing an old backport and silently making it the default install.
      # Vibestrate renumbered DOWN from 1.1.7 to 0.1.0, so every release until
      # the 1.x versions are gone trips that guard. Passing the tag explicitly
      # clears npm's is-this-the-default-tag check and still lands on latest.
      # Dropping this flag does not fail loudly the way most mistakes do - it
      # only fails while a higher version exists, so it would look fine for
      # months and then block a release nobody expected to be blocked.
      - name: Publish
        run: npm publish --provenance --access public --tag latest

      # A publish reporting success while `latest` still points somewhere else
      # means every install keeps getting the old version. Cheap to check, and
      # invisible until a user tells you.
      #
      # Polled, not read once. The registry does not serve a new dist-tag
      # instantly: the 0.1.0 release published correctly and this step still
      # failed, because it asked within seconds and got the previous value. A
      # release check that reports failure on a successful release is worse than
      # no check - the next real failure reads as "that flaky step again".
      #
      # --prefer-online on every attempt, because npm will otherwise answer from
      # its own cached packument and hand back the same stale tag no matter how
      # long the loop waits, turning the retry into an expensive no-op.
      #
      # Still fails if the tag genuinely never moves. The attempt count is
      # printed so the real propagation margin shows up in the log, rather than
      # staying a guess the next person has to re-make.
      - name: Latest points at what we just published
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG=""
          for attempt in $(seq 1 20); do
            TAG="$(npm view --prefer-online vibestrate dist-tags.latest 2>/dev/null || true)"
            if [ "$TAG" = "$PKG" ]; then
              echo "latest -> $TAG (settled after $attempt check(s))"
              exit 0
            fi
            sleep 6
          done
          echo "Published $PKG but dist-tag latest is still \"$TAG\" after ~2 minutes."
          echo "The publish itself succeeded, so the package is on the registry"
          echo "and only the default-install pointer is wrong. Fix with:"
          echo "  npm dist-tag add vibestrate@$PKG latest"
          exit 1
